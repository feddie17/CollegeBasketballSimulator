name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: .NET build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore CBBSimulator.sln
      - name: Build
        run: dotnet build CBBSimulator.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test CBBSimulator.sln --configuration Release --no-build --verbosity normal

  frontend:
    name: Vue build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/CBBSimulator.Client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/CBBSimulator.Client/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
